# 反向代理示例。把 your-domain.com 改成你的域名后：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/krabi
#   sudo ln -sf /etc/nginx/sites-available/krabi /etc/nginx/sites-enabled/krabi
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com   # 自动添加 HTTPS(443) 与 80->443 跳转
server {
    listen 80;
    server_name your-domain.com;

    # 应用允许最大 100MB 的视频上传；nginx 默认上限 1MB 会导致上传报 413。
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
